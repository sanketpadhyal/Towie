version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: towie
    main: ./cmd/towie
    binary: towie
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/sanketpadhyal/towie/internal/buildinfo.Version={{.Version}}
      - -X github.com/sanketpadhyal/towie/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/sanketpadhyal/towie/internal/buildinfo.Date={{.Date}}

archives:
  - id: towie
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
