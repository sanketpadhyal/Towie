# towie.yaml — annotated production configuration
# Copy this file to your project root and run `towie start`

server:
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  shutdown_timeout: 10s
  max_body_size: 10485760

backend:
  target: http://localhost:3000
  dial_timeout: 10s
  response_header_timeout: 30s
  keep_alive: true
  max_idle_conns: 100
  max_idle_conns_per_host: 10

logging:
  level: info
  format: json
  output: stdout

health:
  enabled: true
  path: /health
  probe_backend: true

compression:
  enabled: true
  level: default
  min_size: 1024

cors:
  enabled: false
  allowed_origins: []
  allowed_methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
  allowed_headers: [Content-Type, Authorization]
  allow_credentials: false
  max_age: 3600

security:
  enabled: true
  hsts:
    enabled: false
    max_age: 31536000
    include_subdomains: false
    preload: false
  frame_options: SAMEORIGIN
  content_type_nosniff: true
  xss_protection: false
  referrer_policy: strict-origin-when-cross-origin
